name: Refresh live video IDs

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-resolve YouTube live IDs
        run: python3 scripts/refresh_ids.py cameras.json

      - name: Commit if changed
        run: |
          if ! git diff --quiet cameras.json; then
            git config user.name "cam-refresh-bot"
            git config user.email "actions@github.com"
            git add cameras.json
            git commit -m "Auto-refresh live video IDs"
            git push
          else
            echo "No changes."
          fi
