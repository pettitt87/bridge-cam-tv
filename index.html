<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lockport Bridge Cam</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    font-family: "Space Grotesk", "DM Sans", sans-serif;
  }
  #video, #snap {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #snap, #yt-wrap { display: none; }
  #yt-wrap {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
  }
  #hud {
    position: absolute; top: 40px; left: 50px; right: 50px;
    display: flex; justify-content: space-between; align-items: flex-start;
    transition: opacity 0.4s; z-index: 10;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  #hud.hidden { opacity: 0; }
  #hud, #help { pointer-events: none; }
  .cam-name  { color: #fff;    font-size: 34px; font-weight: 600; letter-spacing: 1px; }
  .cam-sub   { color: #9ca3af; font-size: 22px; margin-top: 6px; letter-spacing: 2px; }
  .cam-cat   { color: #22c55e; font-size: 20px; margin-top: 10px; letter-spacing: 2px; }
  #hud-right { text-align: right; }
  #status    { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
  .badge {
    display: none; margin-top: 10px; margin-left: 8px; color: #0b1220; background: #22c55e;
    font-size: 18px; font-weight: 700; letter-spacing: 2px;
    padding: 4px 12px; border-radius: 4px;
  }
  #sound-badge { background: #60a5fa; }
  #help {
    position: absolute; bottom: 40px; left: 0; right: 0;
    text-align: center; color: #9ca3af; font-size: 20px;
    letter-spacing: 1px; transition: opacity 0.4s; z-index: 10;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  #help.hidden { opacity: 0; }
  #help b { color: #fff; }
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0b1220; z-index: 5; transition: opacity 0.5s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay-text { color: #fff;    font-size: 40px; letter-spacing: 4px; font-weight: 600; }
  #overlay-sub  { color: #6b7280; font-size: 24px; margin-top: 14px; letter-spacing: 2px; }
  .spinner {
    width: 60px; height: 60px; margin-bottom: 30px;
    border: 4px solid #1f2937; border-top-color: #22c55e;
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Grid ── */
  #grid {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 15; display: none;
    grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px;
  }
  #grid.open { display: grid; }
  .g-cell {
    position: relative; background: #0b1220; overflow: hidden;
    border: 3px solid #1f2937; box-sizing: border-box;
  }
  .g-cell.sel { border-color: #22c55e; }
  .g-cell video, .g-cell img, .g-cell iframe {
    width: 100%; height: 100%; object-fit: contain; border: 0; display: block;
    background: #000;
  }
  .g-label {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 14px;
    font-size: 19px; color: #fff; background: rgba(0,0,0,0.55); letter-spacing: 1px;
  }

  /* ── Menu ── */
  #menu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(4, 8, 16, 0.94); z-index: 20; display: none;
  }
  #menu.open { display: flex; }
  #menu-cats {
    width: 34%; height: 100%; overflow: hidden;
    border-right: 1px solid #1f2937; padding: 50px 0;
    box-sizing: border-box;
  }
  #menu-cams {
    flex: 1; height: 100%; overflow: hidden; padding: 50px 0;
    box-sizing: border-box;
  }
  .m-item {
    padding: 14px 40px; font-size: 26px; color: #9ca3af;
    letter-spacing: 1px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .m-item .cnt { color: #4b5563; font-size: 20px; margin-left: 10px; }
  .m-item.sel { color: #fff; background: #111827; }
  .m-item.focus { color: #0b1220; background: #22c55e; font-weight: 600; }
  .m-item.focus .cnt { color: #0b1220; }
  .m-sub { color: #6b7280; font-size: 17px; letter-spacing: 1px; display: block; }
  .suntag { font-size: 17px; font-weight: 700; letter-spacing: 1px; margin-left: 14px; }
  .m-item.focus .suntag { color: #0b1220 !important; }
  .m-item.focus .m-sub { color: #14532d; }
  #menu-title {
    position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
    color: #4b5563; font-size: 18px; letter-spacing: 2px;
  }
</style>
</head>
<body>

<video id="video" autoplay muted></video>
<img id="snap" referrerpolicy="no-referrer" alt="">
<div id="yt-wrap"></div>

<div id="overlay">
  <div class="spinner"></div>
  <div id="overlay-text">LOADING CAMERA LIST...</div>
  <div id="overlay-sub"></div>
</div>

<div id="hud" class="hidden">
  <div>
    <div class="cam-name" id="cam-name"></div>
    <div class="cam-sub" id="cam-sub"></div>
    <div class="cam-cat" id="cam-cat"></div>
  </div>
  <div id="hud-right">
    <div id="status" style="color:#f59e0b">&#9679; CONNECTING</div>
    <span class="badge" id="rotate-badge">&#8635; AUTO-ROTATE</span>
    <span class="badge" id="sound-badge">&#128266; SOUND</span>
  </div>
</div>

<div id="help" class="hidden">
  <b>OK</b> menu &middot; <b>&#9664;&#9654;</b> cam &middot; <b>&#9654;&#10073;&#10073;</b> rotate
  &middot; <b style="color:#ef4444">&#9679;</b> grid
  &middot; <b style="color:#22c55e">&#9679;</b> YT app
  &middot; <b style="color:#facc15">&#9679;</b> &#9733; fav
  &middot; <b style="color:#60a5fa">&#9679;</b> sound
  &middot; <b>BACK</b> exit
</div>

<div id="grid"></div>

<div id="menu">
  <div id="menu-cats"></div>
  <div id="menu-cams"></div>
  <div id="menu-title">
    &#9650;&#9660; NAVIGATE &middot; &#9664;&#9654; SWITCH PANE &middot; OK SELECT &middot; BACK CLOSE
    &nbsp;&nbsp;|&nbsp;&nbsp;
    <span style="color:#facc15">● GOLDEN</span> &middot;
    <span style="color:#fb923c">● LOW SUN</span> &middot;
    <span style="color:#38bdf8">● DAYLIGHT</span> &middot;
    <span style="color:#a78bfa">● TWILIGHT</span> &middot;
    <span style="color:#4b5563">● NIGHT</span>
  </div>
</div>

<script src="hls.min.js"></script>
<script>
(function () {
  var DATA_URL = 'cameras.json';
  var STATE_NAMES = {
    AL:'Alabama', AK:'Alaska', AZ:'Arizona', AR:'Arkansas', CA:'California', CO:'Colorado',
    CT:'Connecticut', DE:'Delaware', DC:'Washington, D.C.', FL:'Florida', GA:'Georgia',
    HI:'Hawaii', ID:'Idaho', IL:'Illinois', IN:'Indiana', IA:'Iowa', KS:'Kansas', KY:'Kentucky',
    LA:'Louisiana', ME:'Maine', MD:'Maryland', MA:'Massachusetts', MI:'Michigan', MN:'Minnesota',
    MS:'Mississippi', MO:'Missouri', MT:'Montana', NE:'Nebraska', NV:'Nevada', NH:'New Hampshire',
    NJ:'New Jersey', NM:'New Mexico', NY:'New York', NC:'North Carolina', ND:'North Dakota',
    OH:'Ohio', OK:'Oklahoma', OR:'Oregon', PA:'Pennsylvania', RI:'Rhode Island',
    SC:'South Carolina', SD:'South Dakota', TN:'Tennessee', TX:'Texas', UT:'Utah', VT:'Vermont',
    VA:'Virginia', WA:'Washington', WV:'West Virginia', WI:'Wisconsin', WY:'Wyoming'
  };
  var SNAP_INTERVAL = 30000;
  var ROTATE_SECONDS = 60;
  var GOLDEN_DEG = 6;      // sun within ±6° of the horizon ≈ golden hour
  var STORE_KEY = 'bctv';

  var video      = document.getElementById('video');
  var snap       = document.getElementById('snap');
  var ytWrap     = document.getElementById('yt-wrap');
  var overlay    = document.getElementById('overlay');
  var overlayTxt = document.getElementById('overlay-text');
  var overlaySub = document.getElementById('overlay-sub');
  var hud        = document.getElementById('hud');
  var help       = document.getElementById('help');
  var camName    = document.getElementById('cam-name');
  var camSub     = document.getElementById('cam-sub');
  var camCat     = document.getElementById('cam-cat');
  var statusEl   = document.getElementById('status');
  var rotBadge   = document.getElementById('rotate-badge');
  var sndBadge   = document.getElementById('sound-badge');
  var gridEl     = document.getElementById('grid');
  var menuEl     = document.getElementById('menu');
  var catsEl     = document.getElementById('menu-cats');
  var camsEl     = document.getElementById('menu-cams');

  var allCams = [], catDefs = [];
  var CATS = [];
  var activeCat = 0, activeIdx = 0;
  var hls = null, hudTimer = null, retryTimer = null, snapTimer = null;
  var snapFails = 0;
  var rotateTimer = null;
  var soundOn = false;
  var favs = [];
  var menuOpen = false, menuPane = 0, menuCat = 0, menuIdx = 0;
  var gridOpen = false, gridPage = 0, gridSel = 0, gridMedia = [];

  function cur() {
    return CATS.length ? CATS[activeCat].cams[activeIdx] : null;
  }

  /* ── Solar position (NOAA approximation) ── */
  function solarPos(lat, lon, date) {
    var rad = Math.PI / 180;
    var doy = Math.floor((date.getTime() - Date.UTC(date.getUTCFullYear(), 0, 1)) / 86400000);
    var hUTC = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
    var g = 2 * Math.PI / 365 * (doy + (hUTC - 12) / 24);
    var eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
                 - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
    var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
               - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
               - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
    var tst = hUTC * 60 + eqtime + 4 * lon;
    var ha = (tst / 4) - 180;
    while (ha < -180) ha += 360;
    while (ha > 180) ha -= 360;
    var cz = Math.sin(lat * rad) * Math.sin(decl) +
             Math.cos(lat * rad) * Math.cos(decl) * Math.cos(ha * rad);
    cz = Math.max(-1, Math.min(1, cz));
    return { elev: 90 - Math.acos(cz) / rad, rising: ha < 0 };
  }

  // Minutes until the sun next crosses the horizon in the wanted direction.
  // null when it never does within 24h (polar day / polar night).
  function nextEvent(lat, lon, wantRising, from) {
    var step = 10, prev = solarPos(lat, lon, from), m, t, p, lo, hi, k, mid, pm, above;
    for (m = step; m <= 1440; m += step) {
      t = new Date(from.getTime() + m * 60000);
      p = solarPos(lat, lon, t);
      if (wantRising ? (prev.elev < 0 && p.elev >= 0) : (prev.elev > 0 && p.elev <= 0)) {
        lo = m - step; hi = m;
        for (k = 0; k < 7; k++) {
          mid = (lo + hi) / 2;
          pm = solarPos(lat, lon, new Date(from.getTime() + mid * 60000));
          above = pm.elev >= 0;
          if (wantRising ? above : !above) hi = mid; else lo = mid;
        }
        return (lo + hi) / 2;
      }
      prev = p;
    }
    return null;
  }

  // Rank for a chase: events in progress first, then soonest upcoming.
  // Scored forward in time so a sunrise that already finished sorts to the back.
  // mode: 'rise' | 'set' | 'both'
  function chaseScore(cam, mode, now) {
    if (typeof cam.lat !== 'number') return 1e9;
    if (mode === 'both') {
      return Math.min(chaseScore(cam, 'rise', now), chaseScore(cam, 'set', now));
    }
    var wantRising = mode === 'rise';
    var p = solarPos(cam.lat, cam.lon, now);
    if (p.rising === wantRising && Math.abs(p.elev) <= GOLDEN_DEG) {
      return -GOLDEN_DEG + Math.abs(p.elev);   // in progress, best light first
    }
    var mins = nextEvent(cam.lat, cam.lon, wantRising, now);
    return mins === null ? 1e8 : mins;
  }

  // Is this camera mid-event for the given mode?
  function inGolden(cam, mode, now) {
    if (typeof cam.lat !== 'number') return false;
    var p = solarPos(cam.lat, cam.lon, now);
    if (Math.abs(p.elev) > GOLDEN_DEG) return false;
    return mode === 'both' || (p.rising === (mode === 'rise'));
  }

  function goldenPick(cams, mode, now) {
    var best = -1, bestScore = 1e9, i, s;
    for (i = 0; i < cams.length; i++) {
      s = chaseScore(cams[i], mode, now);
      if (s < bestScore) { bestScore = s; best = i; }
    }
    return best;
  }

  /* ── Persistence ── */
  function store() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        catId: CATS.length ? CATS[activeCat].id : null,
        camId: cur() ? cur().id : null,
        rotate: !!rotateTimer,
        sound: soundOn,
        favs: favs
      }));
    } catch (e) {}
  }
  function restore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }

  /* ── Categories ── */
  function rebuildCats() {
    var i, j, cat;
    CATS = [];
    if (favs.length) {
      var fc = [];
      for (j = 0; j < allCams.length; j++) {
        if (favs.indexOf(allCams[j].id) !== -1) fc.push(allCams[j]);
      }
      if (fc.length) CATS.push({ id: 'favs', name: '★ My Cams', cams: fc });
    }
    for (i = 0; i < catDefs.length; i++) {
      cat = { id: catDefs[i].id, name: catDefs[i].name, cams: [] };
      for (j = 0; j < allCams.length; j++) {
        if (allCams[j].tags && allCams[j].tags.indexOf(cat.id) !== -1) cat.cams.push(allCams[j]);
      }
      if (cat.cams.length) CATS.push(cat);
    }
    // State categories, generated from each camera's `state` code
    var byState = {}, code;
    for (j = 0; j < allCams.length; j++) {
      code = allCams[j].state;
      if (!code) continue;
      if (!byState[code]) byState[code] = [];
      byState[code].push(allCams[j]);
    }
    var codes = [];
    for (code in byState) if (byState.hasOwnProperty(code)) codes.push(code);
    codes.sort(function (a, b) {
      var na = STATE_NAMES[a] || a, nb = STATE_NAMES[b] || b;
      return na < nb ? -1 : (na > nb ? 1 : 0);
    });
    for (i = 0; i < codes.length; i++) {
      CATS.push({ id: 'st_' + codes[i],
                  name: '◆ ' + (STATE_NAMES[codes[i]] || codes[i]),
                  cams: byState[codes[i]] });
    }
    // Golden-hour chases: same camera pool, sorted east → west
    var geo = [];
    for (j = 0; j < allCams.length; j++) {
      if (typeof allCams[j].lat === 'number') geo.push(allCams[j]);
    }
    if (geo.length) {
      geo = geo.slice().sort(function (a, b) { return b.lon - a.lon; });
      CATS.push({ id: 'sun_rise', name: '☀ Sunrise Chase', cams: geo, chase: 'rise' });
      CATS.push({ id: 'sun_set',  name: '☾ Sunset Chase',  cams: geo, chase: 'set'  });
      CATS.push({ id: 'sun_both', name: '☀☾ Golden Hour Chase', cams: geo, chase: 'both' });
    }
    CATS.push({ id: 'all', name: 'All Cameras', cams: allCams });
  }
  function findCat(id) {
    for (var i = 0; i < CATS.length; i++) if (CATS[i].id === id) return i;
    return -1;
  }
  function findCam(catIdx, camId) {
    var cams = CATS[catIdx].cams;
    for (var i = 0; i < cams.length; i++) if (cams[i].id === camId) return i;
    return -1;
  }

  /* ── HUD / status ── */
  function setStatus(state) {
    var map = {
      connecting: ['● CONNECTING', '#f59e0b'],
      live:       ['● LIVE', '#22c55e'],
      youtube:    ['● LIVE · YOUTUBE', '#22c55e'],
      snapshot:   ['● SNAPSHOT · UPDATES EVERY FEW MIN', '#f59e0b'],
      error:      ['● RECONNECTING', '#ef4444']
    };
    var s = map[state] || map.connecting;
    statusEl.textContent = s[0];
    statusEl.style.color = s[1];
  }
  function showHud(autoHide) {
    hud.classList.remove('hidden');
    help.classList.remove('hidden');
    if (hudTimer) clearTimeout(hudTimer);
    if (autoHide) {
      hudTimer = setTimeout(function () {
        hud.classList.add('hidden');
        help.classList.add('hidden');
      }, 6000);
    }
  }
  function refreshHudText() {
    var cat = CATS[activeCat], cam = cur();
    if (!cam) return;
    var star = favs.indexOf(cam.id) !== -1 ? '★ ' : '';
    camName.textContent = star + cam.name;
    camSub.textContent  = cam.sub || '';
    var line = cat.name.toUpperCase() + ' · ' + (activeIdx + 1) + '/' + cat.cams.length;
    if (typeof cam.lat === 'number') {
      var p = solarPos(cam.lat, cam.lon, new Date());
      line += ' · SUN ' + (p.elev >= 0 ? '+' : '') + p.elev.toFixed(1) + '° ' +
              (p.rising ? '↑' : '↓');
    }
    camCat.textContent = line;
  }

  /* ── Players ── */
  function stopStreams() {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    if (snapTimer)  { clearTimeout(snapTimer);  snapTimer  = null; }
    if (hls) { hls.destroy(); hls = null; }
    video.onloadedmetadata = null;
    video.onerror = null;
    video.pause();
    video.removeAttribute('src');
    video.load();
    ytWrap.innerHTML = '';
    snapFails = 0;
  }

  function applySound() {
    sndBadge.style.display = soundOn ? 'inline-block' : 'none';
    var cam = cur();
    if (!cam) return;
    if (cam.type === 'yt') {
      var f = ytWrap.getElementsByTagName('iframe')[0];
      if (f && f.contentWindow) {
        var cmds = soundOn
          ? [{ event: 'command', func: 'unMute', args: [] },
             { event: 'command', func: 'setVolume', args: [100] }]
          : [{ event: 'command', func: 'mute', args: [] }];
        for (var i = 0; i < cmds.length; i++) {
          f.contentWindow.postMessage(JSON.stringify(cmds[i]), '*');
        }
      }
    } else {
      video.muted = !soundOn;
    }
  }

  function playStream(cam, url, liveState, preferNative) {
    var onUp = function () {
      if (cur() !== cam) return;
      video.play();
      overlay.classList.add('hidden');
      setStatus(liveState);
      applySound();
    };
    var onDown = function () {
      if (cur() !== cam) return;
      overlay.classList.remove('hidden');
      overlayTxt.textContent = 'STREAM ERROR';
      overlaySub.textContent = 'Retrying in a few seconds...';
      setStatus('error');
      if (retryTimer) clearTimeout(retryTimer);
      retryTimer = setTimeout(function () { load(activeCat, activeIdx); }, 5000);
    };
    var nativeOk = video.canPlayType('application/vnd.apple.mpegurl');
    var useNative = preferNative ? !!nativeOk : !(window.Hls && Hls.isSupported());

    if (!useNative && window.Hls && Hls.isSupported()) {
      hls = new Hls({ lowLatencyMode: true, liveSyncDurationCount: 3, maxBufferLength: 10 });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, onUp);
      hls.on(Hls.Events.ERROR, function (e, d) { if (d.fatal) onDown(); });
    } else if (nativeOk) {
      video.onloadedmetadata = onUp;
      video.onerror = onDown;
      video.src = url;
      video.load();
    } else {
      overlayTxt.textContent = 'PLAYBACK NOT SUPPORTED';
      overlaySub.textContent = 'This TV cannot play HLS streams.';
    }
  }

  function snapLoop(cam) {
    var loader = new Image();
    loader.referrerPolicy = 'no-referrer';
    loader.onload = function () {
      if (cur() !== cam || gridOpen) return;
      snap.src = loader.src;
      snapFails = 0;
      overlay.classList.add('hidden');
      setStatus('snapshot');
      snapTimer = setTimeout(function () { snapLoop(cam); }, SNAP_INTERVAL);
    };
    loader.onerror = function () {
      if (cur() !== cam || gridOpen) return;
      snapFails++;
      if (snapFails >= 5) {
        setStatus('error');
        overlay.classList.remove('hidden');
        overlayTxt.textContent = 'CAMERA UNAVAILABLE';
        overlaySub.textContent = 'Retrying...';
      }
      snapTimer = setTimeout(function () { snapLoop(cam); }, SNAP_INTERVAL * 2);
    };
    loader.src = cam.url + '?t=' + Date.now();
  }

  function loadYouTube(cam) {
    var iframe = document.createElement('iframe');
    iframe.setAttribute('allow', 'autoplay; encrypted-media');
    iframe.setAttribute('frameborder', '0');
    iframe.style.cssText = 'width:100%;height:100%;border:0;';
    iframe.onload = function () {
      if (cur() !== cam) return;
      overlay.classList.add('hidden');
      setStatus('youtube');
      if (soundOn) setTimeout(applySound, 1500);
    };
    iframe.src = 'https://www.youtube.com/embed/' + cam.vid +
      '?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&enablejsapi=1' +
      '&origin=' + encodeURIComponent(window.location.origin);
    ytWrap.appendChild(iframe);
  }

  function load(catIdx, camIdx) {
    activeCat = catIdx;
    activeIdx = camIdx;
    var cam = CATS[catIdx].cams[camIdx];

    stopStreams();
    setStatus('connecting');
    overlay.classList.remove('hidden');
    overlayTxt.textContent = 'CONNECTING...';
    overlaySub.textContent = cam.name;
    refreshHudText();
    showHud(true);

    video.style.display  = (cam.type === 'jpg' || cam.type === 'yt') ? 'none' : 'block';
    snap.style.display   = cam.type === 'jpg' ? 'block' : 'none';
    ytWrap.style.display = cam.type === 'yt' ? 'block' : 'none';
    if (cam.type !== 'jpg') snap.removeAttribute('src');

    if (cam.type === 'jpg')      snapLoop(cam);
    else if (cam.type === 'yt')  loadYouTube(cam);
    else                         playStream(cam, cam.url, 'live', false);
    store();

    // A chase list is pointless sitting still — start following the sun on entry.
    if (cat.chase && !rotateTimer) setRotate(true);
  }

  function step(delta) {
    var n = CATS[activeCat].cams.length;
    load(activeCat, (activeIdx + delta + n) % n);
  }

  /* ── Auto-rotate + NYE midnight chase ── */
  function nyePick(cams, now) {
    var utcMin = now.getUTCHours() * 60 + now.getUTCMinutes();
    var best = -1, bestScore = 1e9, i, cam, localMin, score;
    for (i = 0; i < cams.length; i++) {
      cam = cams[i];
      if (typeof cam.nyeOff !== 'number') continue;
      localMin = ((utcMin + cam.nyeOff * 60) % 1440 + 1440) % 1440;
      if (localMin < 45) score = localMin;                 // partying right now
      else score = 100 + (1440 - localMin);                // minutes until midnight
      if (score < bestScore) { bestScore = score; best = i; }
    }
    return best;
  }
  function isNyeWindow(d) {
    var m = d.getUTCMonth(), day = d.getUTCDate();
    return (m === 11 && day === 31) || (m === 0 && day === 1);
  }
  function rotateTick() {
    if (menuOpen || gridOpen) return;
    var cat = CATS[activeCat];
    var now = new Date();
    if (cat.chase) {
      // Stay on the current camera for its whole golden window (±GOLDEN_DEG of
      // the horizon, roughly half an hour either side) instead of hopping to
      // whichever cam is momentarily a fraction closer.
      var held = cur();
      if (held && inGolden(held, cat.chase, now)) {
        refreshHudText();
        return;
      }
      var gp = goldenPick(cat.cams, cat.chase, now);
      if (gp !== -1) {
        if (gp !== activeIdx) load(activeCat, gp);
        else refreshHudText();
        return;
      }
    }
    if (cat.id === 'nye' && isNyeWindow(now)) {
      var pick = nyePick(cat.cams, now);
      if (pick !== -1) {
        if (pick !== activeIdx) load(activeCat, pick);
        return;
      }
    }
    step(1);
  }
  function setRotate(on) {
    if (rotateTimer) { clearInterval(rotateTimer); rotateTimer = null; }
    if (on) {
      var cat = CATS[activeCat];
      var chase = cat && cat.chase;
      var nye = cat && cat.id === 'nye' && isNyeWindow(new Date());
      // Golden-hour chases re-evaluate often; the sun moves ~0.25°/min.
      rotateTimer = setInterval(rotateTick, (chase ? 120 : ROTATE_SECONDS) * 1000);
      rotBadge.innerHTML = chase
        ? (chase === 'rise' ? '☀ SUNRISE CHASE'
           : chase === 'set' ? '☾ SUNSET CHASE' : '☀☾ GOLDEN HOUR CHASE')
        : (nye ? '&#127878; MIDNIGHT CHASE' : '&#8635; AUTO-ROTATE');
      rotBadge.style.display = 'inline-block';
      if (chase || nye) rotateTick();
    } else {
      rotBadge.style.display = 'none';
    }
    showHud(true);
    store();
  }

  /* ── Favorites ── */
  function toggleFav() {
    var cam = cur();
    if (!cam) return;
    var i = favs.indexOf(cam.id);
    if (i === -1) favs.push(cam.id); else favs.splice(i, 1);
    var catId = CATS[activeCat].id, camId = cam.id;
    rebuildCats();
    var ci = findCat(catId);
    if (ci === -1) ci = findCat('all');
    var xi = findCam(ci, camId);
    if (xi === -1) { ci = findCat('all'); xi = findCam(ci, camId); }
    activeCat = ci;
    activeIdx = xi === -1 ? 0 : xi;
    refreshHudText();
    showHud(true);
    store();
  }

  /* ── Grid ── */
  function destroyGridMedia() {
    for (var i = 0; i < gridMedia.length; i++) {
      if (gridMedia[i].hls) try { gridMedia[i].hls.destroy(); } catch (e) {}
      if (gridMedia[i].timer) clearInterval(gridMedia[i].timer);
    }
    gridMedia = [];
  }
  function gridCells() {
    var cams = CATS[activeCat].cams;
    return cams.slice(gridPage * 4, gridPage * 4 + 4);
  }
  function renderGridSel() {
    var cells = gridEl.children;
    for (var i = 0; i < cells.length; i++) {
      cells[i].className = 'g-cell' + (i === gridSel ? ' sel' : '');
    }
  }
  function renderGrid() {
    destroyGridMedia();
    gridEl.innerHTML = '';
    var cams = CATS[activeCat].cams;
    var maxPage = Math.max(0, Math.ceil(cams.length / 4) - 1);
    if (gridPage > maxPage) gridPage = maxPage;
    if (gridPage < 0) gridPage = 0;
    var cells = gridCells();
    if (gridSel >= cells.length) gridSel = cells.length - 1;

    for (var i = 0; i < cells.length; i++) {
      (function (cam, idx) {
        var cell = document.createElement('div');
        cell.className = 'g-cell' + (idx === gridSel ? ' sel' : '');
        var rec = {};
        if (cam.type === 'jpg') {
          var img = document.createElement('img');
          img.referrerPolicy = 'no-referrer';
          img.src = cam.url + '?t=' + Date.now();
          rec.timer = setInterval(function () {
            img.src = cam.url + '?t=' + Date.now();
          }, SNAP_INTERVAL);
          cell.appendChild(img);
        } else if (cam.type === 'yt') {
          var f = document.createElement('iframe');
          f.setAttribute('allow', 'autoplay; encrypted-media');
          f.setAttribute('frameborder', '0');
          f.src = 'https://www.youtube.com/embed/' + cam.vid +
            '?autoplay=1&mute=1&controls=0&playsinline=1&rel=0';
          cell.appendChild(f);
        } else {
          var v = document.createElement('video');
          v.autoplay = true; v.muted = true;
          if (window.Hls && Hls.isSupported()) {
            rec.hls = new Hls({ maxBufferLength: 6 });
            rec.hls.loadSource(cam.url);
            rec.hls.attachMedia(v);
          } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
            v.src = cam.url;
          }
          cell.appendChild(v);
        }
        var lbl = document.createElement('div');
        lbl.className = 'g-label';
        lbl.textContent = (favs.indexOf(cam.id) !== -1 ? '★ ' : '') + cam.name;
        cell.appendChild(lbl);
        cell.onclick = function () { exitGrid(gridPage * 4 + idx); };
        gridMedia.push(rec);
        gridEl.appendChild(cell);
      })(cells[i], i);
    }
  }
  function openGrid() {
    gridOpen = true;
    stopStreams();
    overlay.classList.add('hidden');
    hud.classList.add('hidden');
    help.classList.add('hidden');
    ytWrap.style.display = 'none';
    snap.style.display = 'none';
    video.style.display = 'none';
    gridPage = Math.floor(activeIdx / 4);
    gridSel = activeIdx % 4;
    renderGrid();
    gridEl.classList.add('open');
  }
  function exitGrid(playIdx) {
    destroyGridMedia();
    gridEl.classList.remove('open');
    gridEl.innerHTML = '';
    gridOpen = false;
    load(activeCat, playIdx == null ? activeIdx : playIdx);
  }
  function gridKey(code) {
    var count = gridCells().length;
    if (code === 37) {                       // left
      if (gridSel > 0) { gridSel--; renderGridSel(); }
      else { gridPage--; gridSel = 3; renderGrid(); }
    } else if (code === 39) {                // right
      if (gridSel < count - 1) { gridSel++; renderGridSel(); }
      else { gridPage++; gridSel = 0; renderGrid(); }
    } else if (code === 38) {                // up
      if (gridSel >= 2) { gridSel -= 2; renderGridSel(); }
    } else if (code === 40) {                // down
      if (gridSel + 2 < count) { gridSel += 2; renderGridSel(); }
    } else if (code === 33) {                // ch up: next page
      gridPage++; gridSel = 0; renderGrid();
    } else if (code === 34) {                // ch down: prev page
      gridPage--; gridSel = 0; renderGrid();
    } else if (code === 13) {                // OK: fullscreen selection
      exitGrid(gridPage * 4 + gridSel);
    } else if (code === 461 || code === 403) {
      exitGrid(null);
    }
  }

  /* ── Menu ── */
  // Live daylight badge so you can see which cameras are worth opening.
  function hm(mins) {
    var m = Math.round(mins);
    return m >= 60 ? (Math.floor(m / 60) + 'h' + ('0' + (m % 60)).slice(-2)) : (m + 'm');
  }

  // Countdown badge used inside the chase lists.
  function chaseTag(c, mode) {
    if (typeof c.lat !== 'number') return '';
    var now = new Date();
    var p = solarPos(c.lat, c.lon, now);
    var wantRising = mode === 'both' ? p.rising : (mode === 'rise');
    var word = wantRising ? 'SUNRISE' : 'SUNSET';
    if (inGolden(c, mode, now)) {
      return '<span class="suntag" style="color:#facc15">● ' + word + ' NOW</span>';
    }
    if (mode === 'both') {
      var mr = nextEvent(c.lat, c.lon, true, now), ms = nextEvent(c.lat, c.lon, false, now);
      if (mr === null && ms === null) {
        return '<span class="suntag" style="color:#a78bfa">● ' +
               (p.elev > 0 ? 'MIDNIGHT SUN' : 'POLAR NIGHT') + '</span>';
      }
      wantRising = (ms === null) || (mr !== null && mr <= ms);
      word = wantRising ? 'SUNRISE' : 'SUNSET';
    }
    var mins = nextEvent(c.lat, c.lon, wantRising, new Date());
    if (mins === null) {
      return '<span class="suntag" style="color:#a78bfa">● ' +
             (p.elev > 0 ? 'MIDNIGHT SUN' : 'POLAR NIGHT') + '</span>';
    }
    var col = mins <= 90 ? '#fb923c' : '#4b5563';
    return '<span class="suntag" style="color:' + col + '">● ' + word + ' IN ' + hm(mins) + '</span>';
  }

  function sunTag(c) {
    if (typeof c.lat !== 'number') return '';
    var p = solarPos(c.lat, c.lon, new Date());
    var e = p.elev, arrow = p.rising ? '↑' : '↓', label, color;
    if (e >= -6 && e <= 6)        { label = 'GOLDEN ' + arrow; color = '#facc15'; }
    else if (e > 6 && e <= 15)    { label = 'LOW SUN ' + arrow; color = '#fb923c'; }
    else if (e > 15)              { label = 'DAYLIGHT';        color = '#38bdf8'; }
    else if (e > -12)             { label = 'TWILIGHT ' + arrow; color = '#a78bfa'; }
    else                          { label = 'NIGHT';           color = '#4b5563'; }
    return '<span class="suntag" style="color:' + color + '">● ' + label + '</span>';
  }

  function renderMenu() {
    var i, c, div;
    catsEl.innerHTML = '';
    for (i = 0; i < CATS.length; i++) {
      div = document.createElement('div');
      div.className = 'm-item' +
        (i === menuCat ? (menuPane === 0 ? ' focus' : ' sel') : '');
      var extra = '';
      if (CATS[i].chase) {
        var nowC = new Date(), hot = 0;
        for (var q = 0; q < CATS[i].cams.length; q++) {
          if (inGolden(CATS[i].cams[q], CATS[i].chase, nowC)) hot++;
        }
        extra = '<span class="suntag" style="color:#facc15">● ' + hot + ' NOW</span>';
      }
      div.innerHTML = CATS[i].name +
        '<span class="cnt">' + CATS[i].cams.length + '</span>' + extra;
      div.onclick = (function (idx) {
        return function () { menuCat = idx; menuPane = 1; menuIdx = 0; renderMenu(); };
      })(i);
      catsEl.appendChild(div);
    }
    camsEl.innerHTML = '';
    var mcat = CATS[menuCat];
    // In a chase list, put the cameras closest to golden hour first.
    if (mcat.chase) {
      var nowM = new Date();
      mcat.cams = mcat.cams.slice().sort(function (a, b) {
        return chaseScore(a, mcat.chase, nowM) - chaseScore(b, mcat.chase, nowM);
      });
    }
    var cams = mcat.cams;
    for (i = 0; i < cams.length; i++) {
      c = cams[i];
      div = document.createElement('div');
      div.className = 'm-item' + (menuPane === 1 && i === menuIdx ? ' focus' : '');
      div.innerHTML = (favs.indexOf(c.id) !== -1 ? '★ ' : '') + c.name +
        (mcat.chase ? chaseTag(c, mcat.chase) : sunTag(c)) +
        '<span class="m-sub">' + (c.sub || '') + '</span>';
      div.onclick = (function (catI, camI) {
        return function () { closeMenu(); load(catI, camI); };
      })(menuCat, i);
      camsEl.appendChild(div);
    }
    var pane = menuPane === 0 ? catsEl : camsEl;
    var idx  = menuPane === 0 ? menuCat : menuIdx;
    var node = pane.children[idx];
    if (node) {
      var want = node.offsetTop - pane.clientHeight / 2 + node.clientHeight;
      pane.scrollTop = Math.max(0, want);
    }
  }
  function openMenu() {
    menuOpen = true;
    menuPane = 0;
    menuCat = activeCat;
    menuIdx = activeIdx;
    menuEl.classList.add('open');
    renderMenu();
  }
  function closeMenu() {
    menuOpen = false;
    menuEl.classList.remove('open');
  }
  function menuKey(code) {
    var n;
    if (code === 38 || code === 40) {
      var d = code === 38 ? -1 : 1;
      if (menuPane === 0) {
        menuCat = (menuCat + d + CATS.length) % CATS.length;
        menuIdx = 0;
      } else {
        n = CATS[menuCat].cams.length;
        menuIdx = (menuIdx + d + n) % n;
      }
      renderMenu();
    } else if (code === 37) {
      menuPane = 0; renderMenu();
    } else if (code === 39) {
      menuPane = 1; renderMenu();
    } else if (code === 13) {
      if (menuPane === 0) { menuPane = 1; menuIdx = 0; renderMenu(); }
      else { closeMenu(); load(menuCat, menuIdx); }
    } else if (code === 461) {
      if (menuPane === 1) { menuPane = 0; renderMenu(); }
      else closeMenu();
    }
  }

  /* ── Keys ── */
  document.addEventListener('keydown', function (e) {
    var code = e.keyCode;
    if (code === 461) e.preventDefault();
    if (!CATS.length) {
      if (code === 461) window.close();
      return;
    }
    if (menuOpen) { menuKey(code); return; }
    if (gridOpen) { gridKey(code); return; }
    switch (code) {
      case 13:  openMenu(); break;                       // OK
      case 37: case 34: step(-1); break;                 // left / ch-down
      case 39: case 33: step(1);  break;                 // right / ch-up
      case 38: case 40: showHud(true); break;            // up/down peek hud
      case 415: case 19: case 80:                        // play / pause / P
        setRotate(!rotateTimer); break;
      case 403: case 82: openGrid(); break;              // red / R: grid
      case 404: case 71: {                               // green / G: native YT app
        var c = cur();
        if (!c || c.type !== 'yt') { showHud(true); break; }
        try {
          var br = new PalmServiceBridge();
          br.onservicecallback = function () {};
          br.call('luna://com.webos.applicationManager/launch', JSON.stringify({
            id: 'youtube.leanback.v4',
            params: { contentTarget: 'https://www.youtube.com/tv?v=' + c.vid }
          }));
        } catch (err) {
          overlay.classList.remove('hidden');
          overlayTxt.textContent = 'CANNOT OPEN YOUTUBE APP';
          overlaySub.textContent = 'This TV blocked the app hand-off.';
          setTimeout(function () { overlay.classList.add('hidden'); }, 4000);
        }
        break;
      }
      case 405: case 70: toggleFav(); break;             // yellow / F: favorite
      case 406: case 83:                                 // blue / S: sound
        soundOn = !soundOn;
        applySound();
        showHud(true);
        store();
        break;
      case 461: window.close(); break;                   // back
    }
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !CATS.length) return;
    if (gridOpen) renderGrid();
    else load(activeCat, activeIdx);
  });

  /* ── Boot ── */
  var xhr = new XMLHttpRequest();
  xhr.open('GET', DATA_URL + '?v=' + Date.now(), true);
  xhr.onload = function () {
    try {
      var data = JSON.parse(xhr.responseText);
      allCams = data.cameras;
      catDefs = data.categories;
      var saved = restore();
      if (saved.favs && saved.favs.length) favs = saved.favs;
      soundOn = !!saved.sound;
      rebuildCats();

      var ci = saved.catId != null ? findCat(saved.catId) : -1;
      if (ci === -1) ci = 0;
      var xi = saved.camId != null ? findCam(ci, saved.camId) : -1;
      if (xi === -1) xi = 0;
      load(ci, xi);
      if (saved.rotate) setRotate(true);
      applySound();
    } catch (err) {
      overlayTxt.textContent = 'CAMERA LIST ERROR';
      overlaySub.textContent = String(err).slice(0, 80);
    }
  };
  xhr.onerror = function () {
    overlayTxt.textContent = 'CAMERA LIST UNAVAILABLE';
    overlaySub.textContent = 'Check internet connection.';
  };
  xhr.send();
})();
</script>
</body>
</html>
